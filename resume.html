<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prasad Hegde – Resume</title>
  <style>
    html, body { height:100%; margin:0; }
    #pdfFrame { width:100%; height:100%; border:none; }
    .noscript { padding:2rem; text-align:center; font-family:sans-serif; }
  </style>
</head>
<body>

  <!-- If JavaScript is disabled, fall back to a direct link -->
  <noscript>
    <div class="noscript">
      <p>JavaScript is disabled – click the link below to view your resume.</p>
      <p>
        <a href="assets/resume-single.pdf" download>Download PDF (single‑page)</a> |
        <a href="assets/resume-double.pdf" download>Download PDF (double‑page)</a>
      </p>
    </div>
  </noscript>

  <!-- The iframe that will hold the selected PDF -->
  <iframe id="pdfFrame" src=""></iframe>

  <script>
    // ----- read the query string -----
    const params   = new URLSearchParams(window.location.search);
    const srcParam = params.get('src');          // "single" | "double" | null
    const src      = (srcParam === 'double') ? 'double' : 'single';

    // ----- pick the correct PDF -----
    const pdfUrl = src === 'double'
        ? 'assets/resume-double.pdf'
        : 'assets/resume-single.pdf';

    // ----- set the iframe source -----
    document.getElementById('pdfFrame').src = pdfUrl;
  </script>
</body>
</html>
